    <script>
        function getDoms (ass) {return document.getElementsByClassName(ass);}
        function getDom (id) {return document.getElementById(id);}
        const lists = [document.getElementsByTagName("UL")[0], document.getElementsByTagName("UL")[1], document.getElementsByTagName("UL")[2], document.getElementsByTagName("UL")[3]];
        const southside_root = lists[0];
        const ikes_root = lists[1];
        const globe_root = lists[2];
        const spot_root = lists[3];

        var ss_items = [];
        var ss_rep_corrector = -1;  // Unused at the moment
        var ik_items = [];
        var gl_items = [];
        var sp_items = [];

        getDom("lu").innerHTML = menu.lu;

        function loadItems () {
            // Load Southside
            menu.southside.forEach(function (valu, indx, arr) {
                if (indx != 0) {
                    // Eliminate Repitions
                    if (!ss_items.includes(valu)) {
                        ss_items.push(valu);
                    }
                    // getDoms("ss_li")[indx -1].innerHTML = valu;
                }
            });
            ss_sorted = ss_items.sort((a, b) => a.localeCompare(b));
            ss_sorted.forEach(function (valu, indx, arr) {
                getDoms("ss_li")[indx].innerHTML = valu;
            });
            getDom("southside_len").innerHTML = ss_items.length;

            // Load Ike's
            menu.ikes.forEach(function (valu, indx, arr) {
                if (indx != 0) {
                    if (!ik_items.includes(valu)) {
                        ik_items.push(valu);
                    }
                    // getDoms("ik_li")[indx -1].innerHTML = valu;
                }
            });
            ik_sorted = ik_items.sort((a, b) => a.localeCompare(b));
            ik_sorted.forEach(function (valu, indx, arr) {
                getDoms("ik_li")[indx].innerHTML = valu;
            });
            getDom("ikes_len").innerHTML = ik_items.length;

            // Load The Globe
            menu.globe.forEach(function (valu, indx, arr) {
                if (indx != 0) {
                    if (!gl_items.includes(valu)) {
                        gl_items.push(valu);
                    }
                    // getDoms("gl_li")[indx -1].innerHTML = valu;
                }
            });
            gl_sorted = gl_items.sort((a, b) => a.localeCompare(b));
            gl_sorted.forEach(function (valu, indx, arr) {
                getDoms("gl_li")[indx].innerHTML = valu;
            });
            getDom("globe_len").innerHTML = gl_items.length;

            // Load The Spot
            menu.spot.forEach(function (valu, indx, arr) {
                if (indx != 0) {
                    if (!sp_items.includes(valu)) {
                        sp_items.push(valu);
                    }
                    // getDoms("sp_li")[indx -1].innerHTML = valu;
                }
            });
            sp_sorted = sp_items.sort((a, b) => a.localeCompare(b));
            sp_sorted.forEach(function (valu, indx, arr) {
                getDoms("sp_li")[indx].innerHTML = valu;
            });
            getDom("spot_len").innerHTML = sp_items.length;
        }

        loadItems();
    </script>
